{% extends 'base.html' %}{% block content %}<h1>Comunidades, projetos e centros de custo</h1><section class="card"><h2>Nova unidade financeira</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="fields"><label>Nome<input name="name" required maxlength="100"></label><label>Tipo<select name="kind"><option value="comunidade">Comunidade</option><option value="projeto">Projeto</option><option value="campanha">Campanha</option><option value="centro_custo">Centro de custo</option></select></label></div><button>Cadastrar</button></form></section><section class="card"><h2>Unidades</h2><div class="tablewrap"><table><tr><th>Nome</th><th>Tipo</th><th>Estado</th><th>Ação</th></tr>{% for u in units %}<tr><td>{{ u.name }}</td><td>{{ u.kind }}</td><td>{{ 'Ativa' if u.active else 'Inativa' }}</td><td><form method="post" action="{{ url_for('toggle_unit', unit_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="small secondary">{{ 'Desativar' if u.active else 'Ativar' }}</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
