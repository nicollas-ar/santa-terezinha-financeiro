{% extends 'base.html' %}{% block content %}<h1>Usuários e permissões</h1><section class="card"><h2>Criar conta</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="fields"><label>Usuário<input name="username" required maxlength="80"></label><label>Perfil<select name="role"><option value="secretaria">Secretaria</option><option value="padre">Padre</option></select></label><label>Senha inicial (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label></div><button>Criar usuário</button></form></section><section class="card"><h2>Contas</h2><table><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ 'Ativo' if u.active else 'Inativo' }}</td><td>{% if u.id != current_user.id %}<form method="post" action="{{ url_for('toggle_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="small secondary">{{ 'Desativar' if u.active else 'Ativar' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
